[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "hookrec"
version = "0.1.0"
description = "Hybrid music-artist recommendation MVP"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "fastapi>=0.110,<1", "requests>=2.31,<3"]
[tool.setuptools.packages.find]
include = ["hookrec*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
